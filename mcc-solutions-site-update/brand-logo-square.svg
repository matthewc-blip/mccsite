<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <!-- Background -->
  <rect width="1200" height="1200" fill="#0b0e14"/>

  <!-- Top / bottom gold hairlines -->
  <rect x="0" y="0" width="1200" height="2" fill="#b8973e" opacity="0.35"/>
  <rect x="0" y="1198" width="1200" height="2" fill="#b8973e" opacity="0.35"/>

  <!-- Corner accents -->
  <rect x="70" y="70" width="70" height="1" fill="#b8973e" opacity="0.5"/>
  <rect x="70" y="70" width="1" height="70" fill="#b8973e" opacity="0.5"/>
  <rect x="1060" y="1130" width="70" height="1" fill="#b8973e" opacity="0.5"/>
  <rect x="1129" y="1060" width="1" height="70" fill="#b8973e" opacity="0.5"/>

  <!-- Scale icon (same mark used as the site favicon), scaled up and centered -->
  <g transform="translate(600,420) scale(14) translate(-16,-16)">
    <rect x="15.5" y="6" width="1" height="20" fill="#b8973e"/>
    <rect x="10" y="26" width="12" height="1.5" rx="0.75" fill="#b8973e"/>
    <rect x="6" y="10" width="20" height="1" rx="0.5" fill="#b8973e"/>
    <line x1="8" y1="11" x2="8" y2="16" stroke="#b8973e" stroke-width="0.8"/>
    <line x1="24" y1="11" x2="24" y2="16" stroke="#b8973e" stroke-width="0.8"/>
    <path d="M5 16 Q8 19 11 16" stroke="#b8973e" stroke-width="0.9" fill="none"/>
    <path d="M21 16 Q24 19 27 16" stroke="#b8973e" stroke-width="0.9" fill="none"/>
    <circle cx="16" cy="9.5" r="1.2" fill="#b8973e"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="745" font-family="Georgia, serif" font-size="104" font-weight="400" fill="#f0ede6" letter-spacing="2" text-anchor="middle">MCC Solutions</text>
  <text x="600" y="800" font-family="Georgia, serif" font-size="32" font-weight="300" fill="#b8973e" letter-spacing="10" text-anchor="middle">LLC</text>

  <!-- Divider -->
  <rect x="440" y="845" width="320" height="1" fill="#b8973e" opacity="0.3"/>

  <!-- Tagline -->
  <text x="600" y="900" font-family="Arial, sans-serif" font-size="30" font-weight="300" fill="#888d9a" letter-spacing="0.5" text-anchor="middle">Mobile Notary  ·  Bookkeeping  ·  Web Design</text>

  <!-- Location -->
  <text x="600" y="945" font-family="Arial, sans-serif" font-size="23" font-weight="300" fill="#6b707d" letter-spacing="2" text-anchor="middle">CRANFORD, NJ · CENTRAL NEW JERSEY</text>
</svg>
